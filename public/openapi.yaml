openapi: 3.0.3

info:
  title: Laravel Order Management API
  description: API for authentication, order management, payments and order lifecycle.
  version: 1.0.0

servers:
  - url: http://127.0.0.1:8000/api
    description: Local development

tags:
  - name: Authentication
  - name: Orders

paths:
  /login:
    post:
      tags:
        - Authentication
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  example: user@example.com
                password:
                  type: string
                  format: password
                  example: password
      responses:
        "200":
          description: Login successful
        "422":
          description: Invalid credentials or validation error

  /logout:
    post:
      tags:
        - Authentication
      summary: Logout
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Logout successful
        "401":
          description: Unauthenticated

  /orders:
    post:
      tags:
        - Orders
      summary: Create order
      security:
        - bearerAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            maxLength: 128
          example: order-123456
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - items
              properties:
                items:
                  type: array
                  minItems: 1
                  maxItems: 50
                  items:
                    type: object
                    required:
                      - product_id
                      - quantity
                    properties:
                      product_id:
                        type: integer
                        example: 1
                      quantity:
                        type: integer
                        minimum: 1
                        maximum: 100
                        example: 2
      responses:
        "200":
          description: Order created
        "409":
          description: Business rule or stock error
        "422":
          description: Validation error
        "401":
          description: Unauthenticated

    get:
      tags:
        - Orders
      summary: List user's orders
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Orders retrieved successfully
        "401":
          description: Unauthenticated

  /orders/{order}:
    get:
      tags:
        - Orders
      summary: Get order
      security:
        - bearerAuth: []
      parameters:
        - name: order
          in: path
          required: true
          schema:
            type: integer
          example: 1
      responses:
        "200":
          description: Order retrieved successfully
        "404":
          description: Order not found
        "401":
          description: Unauthenticated

  /orders/{order}/status:
    patch:
      tags:
        - Orders
      summary: Update order status
      security:
        - bearerAuth: []
      parameters:
        - name: order
          in: path
          required: true
          schema:
            type: integer
          example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
              properties:
                status:
                  type: string
                  enum:
                    - pending
                    - confirmed
                    - processing
                    - completed
                    - cancelled
                    - failed
                  example: processing
      responses:
        "200":
          description: Order status updated
        "404":
          description: Order not found
        "409":
          description: Invalid status transition
        "422":
          description: Validation error
        "401":
          description: Unauthenticated

  /orders/{order}/cancel:
    post:
      tags:
        - Orders
      summary: Cancel order
      security:
        - bearerAuth: []
      parameters:
        - name: order
          in: path
          required: true
          schema:
            type: integer
          example: 1
      responses:
        "200":
          description: Order cancelled
        "404":
          description: Order not found
        "409":
          description: Order cannot be cancelled
        "401":
          description: Unauthenticated

  /orders/{order}/logs:
    get:
      tags:
        - Orders
      summary: Get order logs
      security:
        - bearerAuth: []
      parameters:
        - name: order
          in: path
          required: true
          schema:
            type: integer
          example: 1
      responses:
        "200":
          description: Order logs retrieved successfully
        "404":
          description: Order not found
        "401":
          description: Unauthenticated

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Sanctum token
